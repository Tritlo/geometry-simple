name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cabal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ghc: ['9.6.7', '9.8.4', '9.10.3', '9.12.4', '9.14.1']
        include:
          - os: macos-latest
            ghc: '9.14.1'
    name: ${{ matrix.os }} / GHC ${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.18.1.0'
      - run: cabal update
      - run: cabal build all --disable-documentation
      - run: cabal test all --disable-documentation --test-show-details=direct
      - run: cabal check
      - run: cabal sdist .
      - name: Check release contents
        run: python3 dev/check_sdist.py dist-newstyle/sdist/geometry-simple-*.tar.gz
      - name: Build release documentation
        if: matrix.ghc == '9.14.1'
        run: cabal haddock geometry-simple --haddock-for-hackage

  nix:
    name: Nix / GHC 9.14.1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: >-
          nix-build -A checks --no-out-link
          --option sandbox true --option sandbox-fallback false
          --max-jobs 2 --cores 2

  shapely:
    name: GEOS comparisons / DuckDB codecs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.18.1.0'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install uv==0.9.5
      - run: cabal update
      - run: cabal build exe:geometry-simple-shapely-probe
      - name: Check Python types
        run: >-
          uv run --no-project --with shapely==2.1.2
          --with types-shapely==2.1.0.20260728 --with pyright==1.1.414 --with duckdb==1.5.5
          pyright dev/test/shapely_compare.py dev/test/test_shapely_compare.py dev/test/test_duckdb_wkt.py dev/check_sdist.py dev/bench/report.py dev/test/test_dev_tools.py dev/test/test_overlay_precision.py
      - name: Check development tools
        run: uv run --no-project python dev/test/test_dev_tools.py
      - name: Check comparison diagnostics
        run: uv run --script dev/test/test_shapely_compare.py
      - name: Check DuckDB codec interoperability
        run: >-
          uv run --script dev/test/test_duckdb_wkt.py
          --probe "$(cabal list-bin exe:geometry-simple-shapely-probe)"
      - name: Check overlay precision
        run: >-
          uv run --script dev/test/test_overlay_precision.py
          --probe "$(cabal list-bin exe:geometry-simple-shapely-probe)"
      - name: Compare every operation with GEOS
        run: >-
          uv run --script dev/test/shapely_compare.py
          --probe "$(cabal list-bin exe:geometry-simple-shapely-probe)"
          --phase all --cases 100 --buffer-cases 24
          --seed 20261005 --report shapely-report.json
      - name: Save comparison report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shapely-comparison
          path: shapely-report.json
          if-no-files-found: warn
